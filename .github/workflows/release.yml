name: Release

# Publishes a new version to the plugin repository staff have added in Dalamud.
# Run it by hand (Actions > Release > Run workflow) with the new version number; Dalamud offers the
# update to everyone once the version is higher than the one they have.
#
# The repository link staff paste into Dalamud never changes:
#   https://github.com/lithkast/ApolloNCC/releases/latest/download/repo.json

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, three numbers (e.g. 0.1.1). Must be higher than the last release."
        required: true
        type: string
      notes:
        description: "What changed, shown to staff in the plugin installer"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.1.1"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -fsSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q dalamud.zip -d "$RUNNER_TEMP/dalamud"
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet build -c Release -p:Version="$VERSION.0"

      - name: Write the repository listing
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir out
          cp ApolloNCC/bin/x64/Release/ApolloNCC/latest.zip out/latest.zip
          cp ApolloNCC/images/icon.png out/icon.png
          .github/make-repo-json.sh ApolloNCC/bin/x64/Release/ApolloNCC/ApolloNCC.json "$GITHUB_REPOSITORY" "$NOTES" > out/repo.json
          cat out/repo.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v$VERSION" out/latest.zip out/repo.json out/icon.png \
            --target "$GITHUB_SHA" --title "ApolloNCC $VERSION" --notes "${NOTES:-ApolloNCC $VERSION}" --latest
