name: Release

# Publishes the plugins to the plugin repository added in Dalamud. Every release carries every plugin; Dalamud
# offers an update for a plugin only when its version is higher than the one installed.
#
# To release: raise <Version> in the plugin's .csproj (ApolloNCC/ApolloNCC.csproj, DanceLoop/DanceLoop.csproj),
# push, then Actions > Release > Run workflow.
#
# The repository link added in Dalamud never changes:
#   https://github.com/lithkast/ApolloNCC/releases/latest/download/repo.json

on:
  workflow_dispatch:
    inputs:
      apollo_notes:
        description: "What changed in ApolloNCC (leave empty if nothing)"
        required: false
        type: string
      dance_notes:
        description: "What changed in Dance Loop (leave empty if nothing)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: r${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -fsSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q dalamud.zip -d "$RUNNER_TEMP/dalamud"
          echo "DALAMUD_HOME=$RUNNER_TEMP/dalamud" >> "$GITHUB_ENV"

      # An installed plugin's icon comes from the IconUrl in the manifest inside its own package, so it is written
      # in there (pointing at this release's tag) before building. Only plugins with images/icon.png get one.
      - name: Put the icon and repository addresses in each plugin's manifest
        run: |
          for p in ApolloNCC DanceLoop; do
            extra='{RepoUrl: $repo}'
            if [ -f "$p/images/icon.png" ]; then extra='{RepoUrl: $repo, IconUrl: $icon}'; fi
            jq --arg icon "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/$p/images/icon.png" \
               --arg repo "https://github.com/$GITHUB_REPOSITORY" ". + $extra" "$p/$p.json" > manifest.json
            mv manifest.json "$p/$p.json"
          done

      - name: Build
        run: dotnet build -c Release

      - name: Package and write the repository listing
        env:
          APOLLO_NOTES: ${{ inputs.apollo_notes }}
          DANCE_NOTES: ${{ inputs.dance_notes }}
        run: |
          mkdir out
          # ApolloNCC keeps the asset name it has always had, latest.zip
          cp ApolloNCC/bin/x64/Release/ApolloNCC/latest.zip out/latest.zip
          (cd ApolloNCC && zip -q ../out/latest.zip images/icon.png)
          cp DanceLoop/bin/x64/Release/DanceLoop/latest.zip out/DanceLoop.zip
          cp ApolloNCC/images/icon.png out/icon.png
          .github/make-repo-json.sh ApolloNCC/bin/x64/Release/ApolloNCC/ApolloNCC.json "$GITHUB_REPOSITORY" "$TAG" latest.zip "$APOLLO_NOTES" > out/apollo.json
          .github/make-repo-json.sh DanceLoop/bin/x64/Release/DanceLoop/DanceLoop.json "$GITHUB_REPOSITORY" "$TAG" DanceLoop.zip "$DANCE_NOTES" > out/dance.json
          jq -s '.' out/apollo.json out/dance.json > out/repo.json
          rm out/apollo.json out/dance.json
          cat out/repo.json
          unzip -l out/latest.zip
          unzip -l out/DanceLoop.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APOLLO_NOTES: ${{ inputs.apollo_notes }}
          DANCE_NOTES: ${{ inputs.dance_notes }}
        run: |
          apollo=$(jq -r '.[0].AssemblyVersion' out/repo.json)
          dance=$(jq -r '.[1].AssemblyVersion' out/repo.json)
          notes="ApolloNCC $apollo${APOLLO_NOTES:+: $APOLLO_NOTES}
          Dance Loop $dance${DANCE_NOTES:+: $DANCE_NOTES}"
          gh release create "$TAG" out/latest.zip out/DanceLoop.zip out/repo.json out/icon.png \
            --target "$GITHUB_SHA" --title "Release $TAG (ApolloNCC $apollo, Dance Loop $dance)" --notes "$notes" --latest
